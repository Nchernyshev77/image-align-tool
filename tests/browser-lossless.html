<!doctype html>
<meta charset="utf-8">
<title>Streaming import browser checks · 64</title>
<style>body{font:16px system-ui;margin:32px;max-width:1000px}pre{white-space:pre-wrap;padding:16px;background:#f3f4f6}button{padding:10px 16px}</style>
<h1>Streaming import browser checks · 64</h1>
<p>Local synthetic images only. No Miro uploads or network requests for images.</p>
<button id="run">Run pixel and color checks</button>
<pre id="result">Ready</pre>
<script src="../lossless-upload.js?v=64"></script>
<script src="../jpeg-lossless.js?v=64"></script>
<script src="../fast-image-scan.js?v=56"></script>
<script src="../tile-preparation.js?v=64"></script>
<script src="../import-engine.js?v=64"></script>
<script src="./large-jpeg-fixture.js?v=64"></script>
<script src="./memory64-checks.js?v=64"></script>
<script>
const L=window.LosslessUpload;
const result=document.getElementById('result');
const lines=[];
const log=s=>{lines.push(s);result.textContent=lines.join('\n');};
const assert=(ok,message)=>{if(!ok)throw Error(message);};
const blobOf=(canvas,type='image/png')=>new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('Encode failed')),type,1));
async function pixels(blob,conversion='none') {
  const bitmap=await createImageBitmap(blob,{colorSpaceConversion:conversion,premultiplyAlpha:'none'});
  const c=document.createElement('canvas');c.width=bitmap.width;c.height=bitmap.height;
  const ctx=c.getContext('2d',{colorSpace:'srgb',willReadFrequently:true});ctx.drawImage(bitmap,0,0);
  const data=ctx.getImageData(0,0,c.width,c.height).data;bitmap.close();c.width=c.height=1;return data;
}
function compareRegion(expected,actual,sourceWidth,rect,measureOnly=false) {
  let maximum=0;
  for(let y=0;y<rect.height;y++) for(let x=0;x<rect.width;x++) for(let ch=0;ch<4;ch++) {
    const i=((rect.y+y)*sourceWidth+rect.x+x)*4+ch,j=(y*rect.width+x)*4+ch;
    maximum=Math.max(maximum,Math.abs(expected[i]-actual[j]));
    if(!measureOnly && expected[i]!==actual[j]) throw Error(`Pixel mismatch (${rect.x+x},${rect.y+y}) channel ${ch}: ${expected[i]} vs ${actual[j]}`);
  }
  return maximum;
}
function compareJpegRegion(expected,actual,sourceWidth,rect,meta) {
 assert(actual.length===rect.width*rect.height*4,'Decoded JPEG dimensions changed');
 let maximum=0,changed=0;
 for(let y=0;y<rect.height;y++)for(let x=0;x<rect.width;x++){
  const seamX=!meta.safeX&&((rect.x>0&&x<2)||(rect.x+rect.width<meta.width&&x>=rect.width-2));
  const seamY=!meta.safeY&&((rect.y>0&&y<2)||(rect.y+rect.height<meta.height&&y>=rect.height-2));
  let different=false;
  for(let ch=0;ch<4;ch++){
   const a=expected[((rect.y+y)*sourceWidth+rect.x+x)*4+ch],b=actual[(y*rect.width+x)*4+ch];
   if(a!==b){different=true;maximum=Math.max(maximum,Math.abs(a-b));assert(seamX||seamY,`JPEG changed away from a chroma seam at ${rect.x+x},${rect.y+y}`);}
  }
  if(different)changed++;
 }
 return {maximum,changed};
}
async function smallColorTest(space,type) {
  const c=document.createElement('canvas');c.width=97;c.height=61;
  const ctx=c.getContext('2d',{colorSpace:space});
  assert(ctx.getContextAttributes().colorSpace===space,'Requested color space unsupported');
  for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++){
    ctx.fillStyle=space==='display-p3'?`color(display-p3 ${x/96} ${y/60} ${((x+y)%17)/16})`:`rgb(${x*13%256} ${y*23%256} ${(x+y)*37%256})`;
    ctx.fillRect(x,y,1,1);
  }
  const file=await blobOf(c,type),source=type==='image/png'?await L.openSource(file):null;
  const originalRaw=await pixels(file),originalManaged=await pixels(file,'default');
  let displayDifference=0;
  if(type==='image/png')for(const n of [2,4,8])for(const rect of L.dyadicRegions(c.width,c.height,n)){
    const part=await L.encodeRegion(source,rect);
    compareRegion(originalRaw,await pixels(part),c.width,rect);
    displayDifference=Math.max(displayDifference,compareRegion(originalManaged,await pixels(part,'default'),c.width,rect,true));
    const restoredColors=await L.colorMetadata(part);
    assert(JSON.stringify(restoredColors.chunks)===JSON.stringify(source.colors.chunks),'Source color metadata changed');
  }
  if(type==='image/jpeg'){
    const client=JpegLossless.create({workerUrl:'../jpeg-lossless-worker.js?v=64'});
    try{
      const meta=await client.open(file);
      if(meta.eligible){
        for(const count of [2,4,8])for(const rect of L.dyadicRegions(c.width,c.height,count,JpegLossless.cropAlignment(meta))){
          const jpeg=await client.crop(rect);
          compareJpegRegion(originalRaw,await pixels(jpeg),c.width,rect,meta);
          displayDifference=Math.max(displayDifference,compareJpegRegion(originalManaged,await pixels(jpeg,'default'),c.width,rect,meta).maximum);
        }
        log(`PASS ${space} lossless JPEG WASM: 2/4/8 coefficient crops, raw/rendered interior pixels identical, ICC preserved`);
      }else log(`PASS ${space} JPEG guard: ${meta.reason}`);
    }finally{client.dispose();}
  }
  // Exercise the huge-image decoder path against the same color-managed source.
  if(type==='image/png'&&window.createImageBitmap&&window.OffscreenCanvas){
    const worker=new Worker('../slice-worker.js?v=53.1');let req=0;
    const call=(message,transfer=[])=>new Promise((resolve,reject)=>{
      const id=++req;worker.onmessage=e=>{if(e.data.reqId!==id)return;e.data.error?reject(Error(e.data.error)):resolve(e.data);};
      worker.onerror=e=>reject(Error(e.message));worker.postMessage({...message,reqId:id},transfer);
    });
    try {
      const buffer=await file.arrayBuffer();
      await call({type:'open',fileId:'test',mimeType:type,buffer},[buffer]);
      const tile=await call({type:'render',fileId:'test',sx:0,sy:0,sw:c.width,sh:c.height});
      const out=document.createElement('canvas');out.width=c.width;out.height=c.height;
      out.getContext('2d',{colorSpace:'srgb'}).putImageData(new ImageData(new Uint8ClampedArray(tile.buffer),c.width,c.height),0,0);
      const restored=await L.preserveColor(await blobOf(out),source.colors.chunks);
      const rect={x:0,y:0,width:c.width,height:c.height};
      compareRegion(originalRaw,await pixels(restored),c.width,rect);
      displayDifference=Math.max(displayDifference,compareRegion(originalManaged,await pixels(restored,'default'),c.width,rect,true));
    } finally {worker.terminate();}
  }
  if(source)source.close();c.width=c.height=1;
  log(`DISPLAY ${space} ${type}: maximum decoded difference ${displayDifference}/255`);
  if(source)log(`PASS ${space} PNG input: 2/4/8 PNG parts, identical RGBA and color metadata; ${source.colors.description}`);
  else log(`PASS ${space} JPEG input: JPEG output only; no PNG conversion`);
}
async function fixtureTest(){
 const fixtures=await (await fetch('./jpeg-fixtures.json')).json();
 for(const [name,base64] of Object.entries(fixtures)){
  const bytes=Uint8Array.from(atob(base64),c=>c.charCodeAt(0)),file=new Blob([bytes],{type:'image/jpeg'}),meta=JpegLossless.info(bytes);
  if(name==='orientation6'){assert(!meta.eligible,'Unsupported EXIF transform was allowed');log('PASS EXIF rotation: explicit unsupported-crop error, never PNG conversion');continue;}
  assert(meta.eligible,`JPEG ${name} coefficient cropping disabled`);let maxDifference=0,changedPixels=0;
  const source=await pixels(file),managed=await pixels(file,'default'),client=JpegLossless.create({workerUrl:'../jpeg-lossless-worker.js?v=64'});
  try{await client.open(file);for(const n of [2,4,8])for(const rect of L.dyadicRegions(meta.width,meta.height,n,JpegLossless.cropAlignment(meta))){
    const part=await client.crop(rect);assert(part.type==='image/jpeg','JPEG converted to another format');
    const raw=compareJpegRegion(source,await pixels(part),meta.width,rect,meta);compareJpegRegion(managed,await pixels(part,'default'),meta.width,rect,meta);
    maxDifference=Math.max(maxDifference,raw.maximum);changedPixels+=raw.changed;
  }}finally{client.dispose();}
  log(`PASS JPEG ${name}: 2/4/8 JPEG parts; changed seam pixels ${changedPixels}, maximum channel difference ${maxDifference}/255; interior identical`);
 }
}
async function preparationAndRecoveryTest(){
 const fixtures=await(await fetch('./jpeg-fixtures.json')).json(),files=['444','420'].map((type,i)=>new File([Uint8Array.from(atob(fixtures[type]),c=>c.charCodeAt(0))],`Tile_${i+1}.jpg`,{type:'image/jpeg'}));
 const clients=[TilePreparation.create({workerUrl:'../tile-prepare-worker.js?v=64'}),TilePreparation.create({workerUrl:'../tile-prepare-worker.js?v=64'})];
 try{
  await Promise.all(files.map(async(file,i)=>{
   const info=await FastImageScan.scan(file),expected=await pixels(file);
   const prepared=await clients[i].prepare(file,info,[{kind:'tile',sx:0,sy:0,sw:info.width,sh:info.height}]);
   const part=prepared.regions[0].parts[0];
   assert(prepared.regions[0].mode==='lossless-jpeg'&&part.blob.type==='image/jpeg','JPEG was converted to PNG');
   compareRegion(expected,await pixels(part.blob),info.width,part);
   const original=await clients[i].prepare(file,info,[{kind:'full',width:info.width,height:info.height}]);
   assert(original.regions[0].mode==='original'&&original.regions[0].parts.length===1&&original.regions[0].parts[0].original,'Fitting JPEG changed');
  }));log('PASS two background workers: 4:4:4 and 4:2:0 stay JPEG; fitting originals bypass cropping');
  const rotated=new File([Uint8Array.from(atob(fixtures.orientation6),c=>c.charCodeAt(0))],'rotated.jpg',{type:'image/jpeg'}),rotatedInfo=await FastImageScan.scan(rotated);
  let refused=false;try{await clients[0].prepare(rotated,rotatedInfo,[{kind:'tile',sx:0,sy:0,sw:rotatedInfo.width,sh:rotatedInfo.height}]);}catch(e){refused=/EXIF/.test(e.message);}
  assert(refused,'Unsupported rotated JPEG silently fell back to PNG');
 }finally{clients.forEach(c=>c.dispose());}
 const images=new Map();let calls=0,groups=0;
 const board={async createImage(params){assert(params.url.startsWith('data:image/jpeg;'),'JPEG recovery converted a piece to PNG');calls++;if(calls===1)throw Error('Synthetic upload error');
   const item={...params,id:String(calls),setMetadata:async()=>{}};images.set(item.id,item);
   if(calls===2)throw Error('Synthetic lost reply');return item;},
  get:async()=>[...images.values()],group:async({items})=>{groups++;items.forEach(i=>i.groupId='g'+groups);return {id:'g'+groups};}};
 const imported=await ImportEngine.run({files,board,scan:FastImageScan.scan,createPreparer:()=>TilePreparation.create({workerUrl:'../tile-prepare-worker.js?v=64'}),
  layout:async sources=>{for(const s of sources)s.jobs=L.dyadicRegions(s.info.width,s.info.height,4).map(r=>({kind:'tile',sx:r.x,sy:r.y,sw:r.width,sh:r.height,x:r.x+r.width/2,y:r.y+r.height/2}));},
  options:{rateLimit:false,retryDelayMs:0,readDataUrl:blob=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(blob);})}});
 assert(imported.success,'Recovery did not finish');assert(imported.verified===8&&calls===9&&images.size===8&&groups===2,'Missing-part recovery or duplicate protection failed');
 log('PASS streaming import: eight parts verified, failed part reloaded, lost reply recovered without duplicate, two source groups');
}
async function immediateGroupTest(){
 const fixture=await(await fetch('./jpeg-fixtures.json')).json();
 const files=[0,1].map(i=>new File([Uint8Array.from(atob(fixture['444']),c=>c.charCodeAt(0))],`Tile_${i+1}.jpg`,{type:'image/jpeg'}));
 let releaseUploads,releaseMetadata,firstGroup;
 const uploads=new Promise(r=>releaseUploads=r),metadata=new Promise(r=>releaseMetadata=r),earlyGroup=new Promise(r=>firstGroup=r);
 const images=new Map();let calls=0,groups=0;
 const board={async createImage(params){
   if(params.alt.includes(':1.'))await uploads;
   const item={...params,id:String(++calls),setMetadata:async()=>metadata};images.set(item.id,item);return item;
  },get:async()=>[...images.values()],group:async({items})=>{
   groups++;items.forEach(i=>i.groupId='g'+groups);if(groups===1)firstGroup();return {id:'g'+groups};
  }};
 const run=ImportEngine.run({files,board,scan:FastImageScan.scan,createPreparer:()=>TilePreparation.create({workerUrl:'../tile-prepare-worker.js?v=64'}),
  layout:async sources=>{for(const s of sources)s.jobs=L.dyadicRegions(s.info.width,s.info.height,4).map(r=>({kind:'tile',sx:r.x,sy:r.y,sw:r.width,sh:r.height,x:r.x+r.width/2,y:r.y+r.height/2}));},
  options:{workers:2,rateLimit:false,retryDelayMs:0,readDataUrl:blob=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(blob);})}});
 try{
  let timer;
  try{await Promise.race([earlyGroup,new Promise((_,reject)=>timer=setTimeout(()=>reject(Error('Immediate grouping timed out')),15000))]);}finally{clearTimeout(timer);}
  assert(images.size===4&&groups===1,'Group did not precede remaining uploads');
  log('PASS immediate group: first four pieces grouped while second source and metadata are blocked');
 }finally{releaseUploads();releaseMetadata();}
 const imported=await run;assert(imported.success&&groups===2,'Immediate group import failed');
 assert(imported.timings.encodeMs>0&&imported.timings.probes===8,'Preparation measurements missing');
 log('PASS native workers, independent metadata queue and timing summary');
}
async function largeTest(){
 const c=document.createElement('canvas');c.width=c.height=4096;
 const ctx=c.getContext('2d',{colorSpace:'srgb'}),data=ctx.createImageData(c.width,c.height);
 let seed=123456789;
 for(let i=0;i<data.data.length;i+=4){seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;data.data[i]=seed&255;data.data[i+1]=(seed>>>8)&255;data.data[i+2]=(seed>>>16)&255;data.data[i+3]=255;}
 ctx.putImageData(data,0,0);const file=await blobOf(c),client=TilePreparation.create({workerUrl:'../tile-prepare-worker.js?v=64'});
 log(`4096×4096 source PNG: ${file.size} bytes; checking worker candidate layouts…`);
 try{
  const info=await FastImageScan.scan(file),prepared=await client.prepare(file,info,[{kind:'full',width:4096,height:4096}]),region=prepared.regions[0];
  for(const p of region.parts){assert(L.fits(p.blob.size,'image/png'),'Worker selected oversized PNG');compareRegion(data.data,await pixels(p.blob),4096,p);}
  log(`PASS 4096×4096 in background worker: tried ${region.attempts.join(' → ')}, selected ${region.parts.length}; all pixels identical`);
 }finally{client.dispose();c.width=c.height=1;}
}
async function largeDimensionsTest(){
 for(const [width,height,count] of [[16384,16384,8],[32768,4096,4]]){
  const file=new File([LargeJpegFixture.jpeg(width,height)],`Large_${width}x${height}.jpg`,{type:'image/jpeg'}),info=await FastImageScan.scan(file);
  const client=TilePreparation.create({workerUrl:'../tile-prepare-worker.js?v=64'}),started=performance.now();
  log(`Checking native JPEG ${width}×${height}; coefficient buffer ${Math.round(info.jpeg.coefficientBytes/1024**2)} MiB…`);
  try{
   const prepared=await client.prepare(file,info,[{kind:'full',width,height}]),region=prepared.regions[0];
   assert(region.mode==='lossless-jpeg'&&region.parts.length===count,'Large image used a different cutting path');
   let area=0;
   for(const p of region.parts){
    assert(p.blob.type==='image/jpeg'&&L.fits(p.blob.size,'image/jpeg')&&L.dimensionsFit(p.width,p.height),'Large JPEG part exceeds limits');
    const decoded=await pixels(p.blob);assert(decoded.length===p.width*p.height*4,'Large crop dimensions changed');
    for(let i=0;i<decoded.length;i+=4096)assert(decoded[i]===128&&decoded[i+1]===128&&decoded[i+2]===128&&decoded[i+3]===255,'Large crop pixels changed');
    area+=p.width*p.height;
   }
   assert(area===width*height,'Large image pixels were dropped');
   log(`PASS native JPEG ${width}×${height}: ${count} JPEG parts, full resolution, ${Math.round(performance.now()-started)} ms`);
  }finally{client.dispose();}
 }
 const huge=new File([LargeJpegFixture.jpeg(65500,65500,'444')],'Over_budget.jpg',{type:'image/jpeg'}),hugeInfo=await FastImageScan.scan(huge);
 const refusedClient=TilePreparation.create({workerUrl:'../tile-prepare-worker.js?v=64'});let refused=false;
 try{await refusedClient.prepare(huge,hugeInfo,[{kind:'full',width:hugeInfo.width,height:hugeInfo.height}]);}catch(e){refused=/16 GiB/.test(e.message);}finally{refusedClient.dispose();}
 assert(refused,'Oversized working set was not rejected before allocation');
 log('PASS oversized JPEG: 16 GiB preflight error before preview or native allocation');
}
async function memoryAbove2GiBTest(){
 // Valid 16K 4:4:4 JPEG plus ignored trailing bytes. This stresses memory, not image complexity.
 const zeroChunk=new Blob([new Uint8Array(1024**2)]);
 const file=new File([LargeJpegFixture.jpeg(16384,16384,'444'),...Array(512).fill(zeroChunk)],'Memory_16K_444.jpg',{type:'image/jpeg'});
 const info=await FastImageScan.scan(file),client=TilePreparation.create({workerUrl:'../tile-prepare-worker.js?v=64'}),started=performance.now();
 log('Checking 16K 4:4:4 + 512 MiB input padding: actual WASM memory must grow past 2 GiB…');
 try{
  const prepared=await client.prepare(file,info,[{kind:'full',width:16384,height:16384}]),region=prepared.regions[0];
  assert(prepared.timings.jpegPeakHeapBytes>2*1024**3,'Stress check did not exceed the former 2 GiB heap');
  assert(region.mode==='lossless-jpeg'&&region.parts.length===8,'16K stress source did not use eight native JPEG crops');
  let area=0;
  for(const p of region.parts){
   assert(p.blob.type==='image/jpeg'&&L.fits(p.blob.size,'image/jpeg')&&L.dimensionsFit(p.width,p.height),'Stress JPEG part exceeds limits');
   const decoded=await pixels(p.blob);assert(decoded.length===p.width*p.height*4,'Stress JPEG dimensions changed');
   for(let i=0;i<decoded.length;i+=4096)assert(decoded[i]===128&&decoded[i+1]===128&&decoded[i+2]===128&&decoded[i+3]===255,'Stress crop pixels changed');
   area+=p.width*p.height;
  }
  assert(area===16384*16384,'Stress source lost image area');
  log(`PASS 16K 4:4:4 above 2 GiB: heap ${Math.round(prepared.timings.jpegPeakHeapBytes/1024**2)} MiB; 8 JPEG parts, full resolution, ${Math.round(performance.now()-started)} ms`);
 }finally{client.dispose();}
}
document.getElementById('run').onclick=async()=>{
  document.getElementById('run').disabled=true;lines.length=0;log('Running…');
  try{await immediateGroupTest();await preparationAndRecoveryTest();await fixtureTest();for(const space of ['srgb','display-p3'])for(const type of ['image/jpeg','image/png'])await smallColorTest(space,type);await largeDimensionsTest();await memoryAbove2GiBTest();await squareMemory64Test();await largeTest();log('ALL CHECKS PASSED');}
  catch(e){log('FAILED: '+e.message);console.error(e);}
  finally{document.getElementById('run').disabled=false;}
};
</script>
