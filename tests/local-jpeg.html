<!doctype html>
<meta charset="utf-8">
<title>Local JPEG preparation check</title>
<style>body{font:16px system-ui;margin:32px;max-width:1100px}pre{white-space:pre-wrap;background:#f3f4f6;padding:16px}button{padding:10px;margin:8px 8px 8px 0}</style>
<h1>Local JPEG preparation check</h1>
<p>The selected original stays in this browser. No images are uploaded.</p>
<label>Original JPEG <input id="file" type="file" accept="image/jpeg"></label>
<p><button id="thumbnail" disabled>Check original thumbnail</button><button id="crop" disabled>Check first native JPEG crop</button></p>
<pre id="log">Select an original JPEG.</pre>
<script src="../jpeg-lossless.js?v=62"></script>
<script src="../fast-image-scan.js?v=56"></script>
<script>
let file,info,worker,timer;const output=document.getElementById('log');
const log=s=>output.textContent+='\n'+s;
const enable=()=>{for(const id of ['thumbnail','crop'])document.getElementById(id).disabled=!file||!info||!!worker;};
document.getElementById('file').onchange=async e=>{
 file=e.target.files[0];info=null;output.textContent='Reading header…';enable();
 try{info=await FastImageScan.scan(file);output.textContent=JSON.stringify({name:file.name,bytes:file.size,...info,
 estimatedWorkspaceBytes:JpegLossless.workspaceBytes(info.jpeg,file.size),heapLimitBytes:JpegLossless.HEAP_BYTES},null,2);}
 catch(e){log('ERROR: '+e.message);}enable();
};
function run(type){
 if(worker)return;const started=performance.now();worker=new Worker('./local-jpeg-worker.js?v=1');enable();
 const finish=()=>{clearTimeout(timer);worker.terminate();worker=null;enable();};
 const arm=stage=>{clearTimeout(timer);timer=setTimeout(()=>{log(`TIMEOUT during ${stage}; ${Math.round((performance.now()-started)/1000)} s`);finish();},180000);};
 arm(type);log('Starting '+type+'…');
 worker.onmessage=e=>{const m=e.data;log(JSON.stringify({...m,elapsedMs:Math.round(performance.now()-started)}));if(m.stage)arm(m.stage);if(m.done||m.error)finish();};
 worker.onerror=e=>{log('ERROR: '+e.message);finish();};
 worker.postMessage({type,file,info});
}
document.getElementById('thumbnail').onclick=()=>run('thumbnail');
document.getElementById('crop').onclick=()=>run('crop');
</script>
