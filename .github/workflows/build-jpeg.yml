name: Build native JPEG codec
on:
  push:
    branches: [main, test/original-upload-52]
    paths: [codec/**, jpeg-lossless.js, jpeg-lossless-worker.js, tile-preparation.js, tile-prepare-worker.js, tests/**, .github/workflows/build-jpeg.yml]
permissions:
  contents: write
concurrency:
  group: jpeg-codec-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install pinned Emscripten SDK
        shell: bash
        run: |
          git clone --depth 1 --branch 4.0.21 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/image-align-emsdk"
          test "$(git -C "$RUNNER_TEMP/image-align-emsdk" rev-parse HEAD)" = b2436aafa7351ee1b581f15841f1b45ed716a279
          "$RUNNER_TEMP/image-align-emsdk/emsdk" install 4.0.21
          "$RUNNER_TEMP/image-align-emsdk/emsdk" activate 4.0.21
      - name: Build 4 GiB and 16 GiB coefficient crop modules
        shell: bash
        run: |
          source "$RUNNER_TEMP/image-align-emsdk/emsdk_env.sh"
          bash codec/build.sh
      - name: Verify native JPEG quality and memory above 2 GiB
        run: |
          node --test tests/*.test.cjs
          node codec/verify-build.cjs
          node codec/verify-memory64.cjs
      - name: Commit verified generated codec
        shell: bash
        run: |
          git add vendor/jpegcropscale/jpeg_worker*.js vendor/jpegcropscale/jpeg_worker*.wasm
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Build verified native JPEG codecs for wasm32 and memory64'
          git push origin "HEAD:${GITHUB_REF}"
